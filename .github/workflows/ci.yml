# Typecheck, tests and the agent-harness lint on every push and pull request.
#
# The repo signs real transactions, so "the tests passed on my machine" is not
# a standard it can be held to. The suite is hermetic — test/setup.ts clears
# every WATERX_* / SUI_* variable before any file loads — so a runner with no
# configuration is the honest place to run it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The deployment moves on its own; the check that notices has to run on its
  # own too, not only when someone opens a pull request.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  # Both platforms, because the package names neither and therefore claims both.
  #
  # It was claiming one it did not work on. The runner makes its writes durable
  # by syncing the directory after a rename, and Windows cannot sync a directory
  # at all: `fsync` there is `FlushFileBuffers`, which needs a writable handle.
  # Every `queue` threw — AFTER the rename had landed — so the caller was told
  # its intent had not been accepted while the runner was about to trade it, and
  # running the command again turned one intent into two orders. Nothing in CI
  # could notice, because nothing in CI had ever run on Windows.
  #
  # fail-fast is off so a failure on one platform still reports the other. The
  # two diverge exactly where this kind of bug lives, and "ubuntu cancelled" is
  # not an answer about Windows.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's `packageManager` field
      # already pins it, and the action refuses two sources of truth. Local and
      # CI therefore cannot drift to different pnpm versions.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: a PR that changes dependencies must say so in the
      # lockfile rather than resolving something different in CI than locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

  # The agent harness: AGENTS.md is the only instruction file (a committed
  # CLAUDE.md hides it from Claude Code), the root stays within what both tools
  # load, .codex/config.toml raises Codex's byte cap, and the knowledge hub has
  # its README. The script is vendored from Bucket-Protocol/waterx-commons
  # (harness/lint/check-harness.sh); bash and git only, so no install step.
  harness:
    runs-on: ubuntu-latest
    # It reads the checkout and nothing else, so the token gets nothing more.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/agent-hooks/check-harness.sh

  # The corpus records argument layouts captured from real transactions, and
  # every positional check in `verify.ts` reads them. A file does not go stale
  # by itself, so nothing above can notice when the deployment moves on — this
  # job asks the deployment directly.
  #
  # Separate from `check` on purpose. It needs the network, and a config
  # document that is briefly unreachable must not read as "the layouts are
  # wrong" (the script exits 7 for that, and the step below says so). Daily,
  # plus whenever a change touches the fixture or the code that reads it.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every read command, started for real. The hermetic suite cannot catch a
      # command that fails on invocation — `balance` shipped with a top-level
      # TDZ error that typechecked and passed every unit test, because nothing
      # had ever run it.
      - name: Does every read command answer with a valid envelope?
        run: |
          set +e
          pnpm run smoke
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "::warning::the read commands could not all be verified (network, or a real fault — see the log)"
          fi

      # Once per network, because the script asks about ONE: the corpus is keyed
      # by network, `check-corpus` reads `config.network`, and the default is
      # mainnet. So a single run left testnet's layouts unchecked — the corpus
      # held both and CI could only ever have noticed one going stale. The loop
      # does not stop at the first bad network, or the second would be hidden
      # behind the first for as long as the first takes to fix.
      - name: Is the ABI corpus still a description of each deployment?
        run: |
          stale=""
          for network in mainnet testnet; do
            set +e
            WATERX_NETWORK=$network pnpm run check-corpus
            status=$?
            set -e
            case $status in
              0) echo "::notice::$network: the corpus still describes the deployment" ;;
              7) echo "::warning::$network: the deployment config was unreachable; corpus freshness is unknown" ;;
              *) echo "::error::$network: the ABI corpus no longer describes the running deployment — run \`pnpm run capture-corpus\`" ; stale="$stale $network" ;;
            esac
          done
          if [ -n "$stale" ]; then
            echo "stale on:$stale"
            exit 1
          fi
